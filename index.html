<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>(〃ﾟｏ ﾟ〃) 니홍고뱅꾜 (,,Ő ｘ Ő,,)</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- 히어로 이미지 영역 -->
  <section class="hero">
     <div class="hero-content"></div> 
  </section>

  <!-- 일반 콘텐츠 -->
  <section class="content">
    <h2>중간 콘텐츠 영역</h2>
    <p>이곳에 소개나 설명이 들어갑니다.</p>
  </section>

  <!-- 갤러리 영역 -->
  <section class="gallery">
    <div class="gallery-grid">
      <!-- 이미지 30개 (샘플 반복) -->
      <!-- 실제로는 썸네일 이미지로 교체 -->
      <img src="https://picsum.photos/seed/1/200" alt="1" />
      <img src="https://picsum.photos/seed/2/200" alt="2" />
      <img src="https://picsum.photos/seed/3/200" alt="3" />
      <!-- ... 같은 형식으로 총 30개 -->
      <!-- 아래는 자동 생성 방법도 가능 -->
      <!-- JS로도 생성 가능 -->
      <!-- 여기선 수동 예시 -->
      <!-- 반복 -->
      <img src="https://picsum.photos/seed/30/200" alt="30" />
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
