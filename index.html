<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스크롤 축소 히어로 + 가로 3칸</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hero {
      position: sticky;
      top: 0;
      z-index: 50;
      transform-origin: top;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- 히어로 영역 (스크롤에 따라 축소) -->
  <div id="hero" class="hero w-full h-96 bg-blue-600 text-white flex items-center justify-center text-6xl">
    멋진 히어로 이미지/제목
  </div>

  <!-- 아래 3칸 (가로 3열 그리드) -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-7xl mx-auto px-6 py-12">
    <div class="bg-white p-8 shadow rounded h-[120vh] flex items-center justify-center text-2xl">콘텐츠 1</div>
    <div class="bg-white p-8 shadow rounded h-[120vh] flex items-center justify-center text-2xl">콘텐츠 2</div>
    <div class="bg-white p-8 shadow rounded h-[120vh] flex items-center justify-center text-2xl">콘텐츠 3</div>
  </div>

  <!-- JS: 스크롤에 따라 히어로 크기 축소 -->
  <script>
    const hero = document.getElementById('hero');

    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      const minHeight = 40;       // 최소 높이
      const maxHeight = 384;      // 96 * 4 = 384px (tailwind h-96)
      const height = Math.max(minHeight, maxHeight - scrollY);

      const minFont = 1.2;        // 최소 폰트 크기 (rem)
      const maxFont = 3.75;       // 약 60px
      const fontSize = Math.max(minFont, maxFont - scrollY / 100);

      hero.style.height = `${height}px`;
      hero.style.fontSize = `${fontSize}rem`;
    });
  </script>
</body>
</html>
