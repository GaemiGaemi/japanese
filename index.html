<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>(〃ﾟｏ ﾟ〃) 니홍고뱅꾜 (,,Ő ｘ Ő,,)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 첫 번째 칸: 전체 화면 이미지 -->
  <section class="hero">
    <img src="TitleImage.PNG" alt="TitleImage" class="hero-image" />
  </section>

  <!-- 두 번째 칸: 일반 콘텐츠 -->
  <section class="content">
    <div class="content-inner">
      <h2>두 번째 칸 콘텐츠</h2>
      <p>여기에 원하는 내용을 입력하세요.</p>
    </div>
  </section>

  <!-- 세 번째 칸: 클릭 가능한 이미지 30개 -->
  <section class="gallery">
    <h2>이미지 갤러리</h2>
    <div class="gallery-grid">
      <!-- 예시 이미지 30개 -->
      <!-- 나중에 JS 또는 반복문으로 자동 생성 가능 -->
      <!-- 현재는 수동 예시 6개만 표시 -->
      <a href="#"><img src="thumb1.jpg" alt="썸네일 1" /></a>
      <a href="#"><img src="thumb2.jpg" alt="썸네일 2" /></a>
      <a href="#"><img src="thumb3.jpg" alt="썸네일 3" /></a>
      <a href="#"><img src="thumb4.jpg" alt="썸네일 4" /></a>
      <a href="#"><img src="thumb5.jpg" alt="썸네일 5" /></a>
      <a href="#"><img src="thumb6.jpg" alt="썸네일 6" /></a>
      <!-- ... 더 추가 -->
    </div>
  </section>
</body>
</html>
